name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet publish -c Release -r win-x64 --self-contained false -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: modem-manager-windows-x64
          path: artifacts/HuaweiE303VoiceDialer.exe
